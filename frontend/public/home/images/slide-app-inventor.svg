<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" width="1440" height="600">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e0a3c"/>
      <stop offset="50%" style="stop-color:#2d1b69"/>
      <stop offset="100%" style="stop-color:#1a1040"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#7c3aed" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1440" height="600" fill="url(#bg2)"/>
  <rect width="1440" height="600" fill="url(#dots)"/>

  <circle cx="1050" cy="180" r="200" fill="#7c3aed" opacity="0.10"/>
  <circle cx="1250" cy="420" r="160" fill="#ec4899" opacity="0.08"/>
  <circle cx="900" cy="500" r="120" fill="#8b5cf6" opacity="0.12"/>

  <!-- Phone mockup -->
  <g transform="translate(800, 60)">
    <rect x="0" y="0" width="160" height="290" rx="18" fill="#1c1917" stroke="#6d28d9" stroke-width="2"/>
    <rect x="8" y="12" width="144" height="260" rx="10" fill="#0f172a"/>
    <rect x="55" y="8" width="50" height="8" rx="4" fill="#111827"/>
    <rect x="8" y="12" width="144" height="16" rx="0" fill="#1e1b4b"/>
    <text x="20" y="24" fill="#a5b4fc" font-size="7" font-family="sans-serif">9:41</text>
    <text x="135" y="24" text-anchor="end" fill="#a5b4fc" font-size="7" font-family="sans-serif">100%</text>
    <rect x="8" y="28" width="144" height="28" fill="#4c1d95"/>
    <text x="80" y="47" text-anchor="middle" fill="white" font-size="11" font-weight="bold" font-family="sans-serif">나의 앱</text>
    <rect x="18" y="68" width="124" height="32" rx="6" fill="#7c3aed"/>
    <text x="80" y="89" text-anchor="middle" fill="white" font-size="10" font-family="sans-serif">버튼 클릭!</text>
    <rect x="18" y="108" width="124" height="32" rx="6" fill="#db2777"/>
    <text x="80" y="129" text-anchor="middle" fill="white" font-size="10" font-family="sans-serif">사진 찍기</text>
    <rect x="18" y="148" width="60" height="60" rx="6" fill="#065f46"/>
    <text x="48" y="182" text-anchor="middle" fill="white" font-size="9" font-family="sans-serif">지도</text>
    <rect x="86" y="148" width="56" height="60" rx="6" fill="#1e40af"/>
    <text x="114" y="182" text-anchor="middle" fill="white" font-size="9" font-family="sans-serif">알림</text>
    <rect x="18" y="220" width="124" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="26" y="238" fill="#94a3b8" font-size="8" font-family="monospace">출력: 안녕하세요!</text>
    <text x="26" y="252" fill="#64748b" font-size="7" font-family="monospace">Label1.Text = "Hello"</text>
    <rect x="55" y="278" width="50" height="4" rx="2" fill="#4b5563"/>
  </g>

  <!-- Coding blocks -->
  <g transform="translate(1020, 100)">
    <rect x="0" y="0" width="160" height="38" rx="6" fill="#f97316"/>
    <polygon points="0,38 15,50 30,38" fill="#ea580c"/>
    <text x="10" y="15" fill="white" font-size="10" font-weight="bold" font-family="sans-serif">when Button1.Click</text>
    <text x="10" y="29" fill="#fed7aa" font-size="9" font-family="sans-serif">do</text>
  </g>

  <g transform="translate(1040, 160)">
    <rect x="0" y="0" width="190" height="32" rx="6" fill="#8b5cf6"/>
    <text x="10" y="14" fill="white" font-size="9" font-family="sans-serif">set Label1.Text to</text>
    <rect x="140" y="6" width="45" height="20" rx="4" fill="#c4b5fd"/>
    <text x="163" y="20" text-anchor="middle" fill="#4c1d95" font-size="9" font-family="sans-serif">"안녕!"</text>
  </g>

  <g transform="translate(1010, 215)">
    <rect x="0" y="0" width="140" height="32" rx="6" fill="#10b981"/>
    <polygon points="0,32 15,44 30,32" fill="#059669"/>
    <text x="10" y="14" fill="white" font-size="10" font-weight="bold" font-family="sans-serif">if</text>
    <rect x="25" y="6" width="60" height="20" rx="4" fill="#6ee7b7"/>
    <text x="55" y="20" text-anchor="middle" fill="#065f46" font-size="9" font-family="sans-serif">조건</text>
    <text x="92" y="14" fill="white" font-size="10" font-weight="bold" font-family="sans-serif">then</text>
  </g>

  <g transform="translate(1055, 265)">
    <rect x="0" y="0" width="150" height="32" rx="6" fill="#ec4899"/>
    <text x="10" y="14" fill="white" font-size="9" font-family="sans-serif">call Sound1.Play</text>
    <text x="10" y="26" fill="#fce7f3" font-size="8" font-family="sans-serif">source: "beep.mp3"</text>
  </g>

  <g transform="translate(1050, 310)">
    <rect x="0" y="0" width="80" height="28" rx="14" fill="#f59e0b"/>
    <text x="40" y="19" text-anchor="middle" fill="white" font-size="12" font-weight="bold" font-family="sans-serif">100</text>
  </g>

  <g transform="translate(1140, 310)">
    <rect x="0" y="0" width="110" height="28" rx="6" fill="#06b6d4"/>
    <text x="10" y="19" fill="white" font-size="11" font-family="sans-serif">숫자 + 숫자</text>
  </g>

  <g transform="translate(1020, 360)">
    <rect x="0" y="0" width="160" height="32" rx="6" fill="#6366f1"/>
    <polygon points="0,32 15,44 30,32" fill="#4f46e5"/>
    <text x="10" y="14" fill="white" font-size="10" font-weight="bold" font-family="sans-serif">for each number</text>
    <text x="10" y="27" fill="#c7d2fe" font-size="9" font-family="sans-serif">from 1 to 10</text>
  </g>

  <g stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5" fill="none">
    <line x1="1020" y1="138" x2="1040" y2="160"/>
    <line x1="1040" y1="192" x2="1010" y2="215"/>
    <line x1="1010" y1="247" x2="1055" y2="265"/>
  </g>

  <g opacity="0.4">
    <rect x="580" y="350" width="130" height="26" rx="5" fill="#f97316"/>
    <text x="590" y="368" fill="white" font-size="9" font-family="sans-serif">when Screen1.Initialize</text>
    <rect x="595" y="385" width="110" height="24" rx="5" fill="#7c3aed"/>
    <text x="605" y="401" fill="white" font-size="9" font-family="sans-serif">set BackgroundColor</text>
    <rect x="610" y="417" width="90" height="24" rx="5" fill="#10b981"/>
    <text x="620" y="433" fill="white" font-size="9" font-family="sans-serif">call Vibrate(500)</text>
  </g>

  <g fill="#e879f9" opacity="0.6" filter="url(#glow2)">
    <circle cx="760" cy="80" r="3"/>
    <circle cx="1380" cy="120" r="2.5"/>
    <circle cx="1420" cy="350" r="2"/>
    <circle cx="680" cy="480" r="3"/>
    <circle cx="560" cy="200" r="2"/>
    <circle cx="1350" cy="520" r="2.5"/>
  </g>
  <g fill="#fbbf24" opacity="0.5">
    <circle cx="200" cy="150" r="2.5"/>
    <circle cx="300" cy="400" r="2"/>
    <circle cx="450" cy="100" r="3"/>
    <circle cx="520" cy="520" r="2"/>
  </g>
</svg>
