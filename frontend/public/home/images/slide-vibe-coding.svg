<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" width="1440" height="600">
  <defs>
    <linearGradient id="vbg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0a1f"/>
      <stop offset="45%" style="stop-color:#1a1240"/>
      <stop offset="100%" style="stop-color:#0e1a3a"/>
    </linearGradient>
    <radialGradient id="vnebA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0a1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vnebB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b0a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vpanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13111f"/>
      <stop offset="100%" stop-color="#1c1930"/>
    </linearGradient>
    <linearGradient id="vbubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="vglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="vsoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="vshadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#010014" flood-opacity="0.6"/>
    </filter>
    <pattern id="vgrid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#818cf8" stroke-width="0.4" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="1440" height="600" fill="url(#vbg1)"/>
  <rect width="1440" height="600" fill="url(#vgrid)"/>
  <g filter="url(#vsoft)">
    <ellipse cx="1080" cy="200" rx="320" ry="240" fill="url(#vnebA)"/>
    <ellipse cx="1300" cy="420" rx="240" ry="200" fill="url(#vnebB)"/>
  </g>

  <!-- Chat prompt bubble (vibe coding: describing intent to AI) -->
  <g transform="translate(760, 70)" filter="url(#vshadow)">
    <path d="M 20 0 L 380 0 Q 400 0 400 20 L 400 100 Q 400 120 380 120 L 60 120 L 25 150 L 30 120 L 20 120 Q 0 120 0 100 L 0 20 Q 0 0 20 0 Z" fill="url(#vbubble)"/>
    <text x="24" y="38" fill="white" font-size="15" font-family="sans-serif" font-weight="600">"로그인 페이지 만들어줘,</text>
    <text x="24" y="60" fill="white" font-size="15" font-family="sans-serif" font-weight="600">보라색 그라데이션으로"</text>
    <circle cx="360" cy="30" r="4" fill="#fef9c3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Code editor -->
  <g transform="translate(700, 260)" filter="url(#vshadow)">
    <rect x="0" y="0" width="380" height="230" rx="10" fill="url(#vpanel)" stroke="#3730a3" stroke-width="1.5"/>
    <rect x="0" y="0" width="380" height="32" rx="10" fill="#1e1b3a"/>
    <circle cx="18" cy="16" r="5" fill="#ff5f57"/>
    <circle cx="34" cy="16" r="5" fill="#ffbd2e"/>
    <circle cx="50" cy="16" r="5" fill="#28c840"/>
    <text x="190" y="21" text-anchor="middle" fill="#a5b4fc" font-size="10" font-family="monospace">LoginPage.tsx</text>

    <text x="16" y="58" fill="#c084fc" font-size="11" font-family="monospace">export function</text>
    <text x="128" y="58" fill="#93c5fd" font-size="11" font-family="monospace">LoginPage</text>
    <text x="16" y="78" fill="#e0e7ff" font-size="11" font-family="monospace">  return (</text>
    <text x="16" y="98" fill="#5eead4" font-size="11" font-family="monospace">    &lt;div className=</text>
    <text x="166" y="98" fill="#fca5a5" font-size="11" font-family="monospace">"bg-gradient..."</text>
    <text x="16" y="118" fill="#5eead4" font-size="11" font-family="monospace">      &lt;input /&gt;</text>
    <text x="16" y="138" fill="#5eead4" font-size="11" font-family="monospace">      &lt;Button&gt;로그인&lt;/Button&gt;</text>
    <text x="16" y="158" fill="#5eead4" font-size="11" font-family="monospace">    &lt;/div&gt;</text>
    <text x="16" y="178" fill="#e0e7ff" font-size="11" font-family="monospace">  )</text>
    <text x="16" y="198" fill="#e0e7ff" font-size="11" font-family="monospace">&#125;</text>
    <rect x="16" y="200" width="7" height="13" fill="#a5b4fc">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- floating tags -->
  <g font-family="monospace" font-size="12" font-weight="600">
    <g transform="translate(120,120)"><rect width="150" height="34" rx="17" fill="#312e81" opacity="0.8"/><text x="75" y="22" text-anchor="middle" fill="#a5b4fc">Next.js</text></g>
    <g transform="translate(90,190)"><rect width="150" height="34" rx="17" fill="#1e3a8a" opacity="0.8"/><text x="75" y="22" text-anchor="middle" fill="#93c5fd">React</text></g>
    <g transform="translate(150,260)"><rect width="170" height="34" rx="17" fill="#065f46" opacity="0.8"/><text x="85" y="22" text-anchor="middle" fill="#6ee7b7">Django REST</text></g>
    <g transform="translate(100,330)"><rect width="150" height="34" rx="17" fill="#581c87" opacity="0.8"/><text x="75" y="22" text-anchor="middle" fill="#d8b4fe">Tailwind CSS</text></g>
    <g transform="translate(170,400)"><rect width="150" height="34" rx="17" fill="#155e75" opacity="0.8"/><text x="75" y="22" text-anchor="middle" fill="#67e8f9">Vercel 배포</text></g>
  </g>

  <!-- twinkles -->
  <g fill="#a5b4fc" filter="url(#vglow)">
    <circle cx="200" cy="80" r="2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1380" cy="120" r="2"><animate attributeName="opacity" values="0.25;0.95;0.25" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1300" cy="500" r="2.5"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="500" r="2"><animate attributeName="opacity" values="0.65;0.2;0.65" dur="3.9s" repeatCount="indefinite"/></circle>
  </g>
</svg>
