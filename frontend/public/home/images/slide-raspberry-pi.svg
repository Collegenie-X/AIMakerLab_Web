<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" width="1440" height="600">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060b18"/>
      <stop offset="45%" style="stop-color:#132f52"/>
      <stop offset="100%" style="stop-color:#0b4a6e"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#1d4ed8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette1" cx="55%" cy="45%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="board" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c7a45"/>
      <stop offset="55%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#0d3d21"/>
    </linearGradient>
    <linearGradient id="boardSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pinGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6d1f"/>
    </linearGradient>
    <linearGradient id="pinSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="wifiGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="boardShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.65"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3b82f6" stroke-width="0.5" opacity="0.22"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#7dd3fc" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1440" height="600" fill="url(#bg1)"/>
  <rect width="1440" height="600" fill="url(#grid)"/>

  <!-- Nebula glow blobs -->
  <g filter="url(#softBlur)">
    <ellipse cx="1090" cy="150" rx="300" ry="230" fill="url(#nebulaA)">
      <animate attributeName="rx" values="300;330;300" dur="11s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1230" cy="390" rx="270" ry="210" fill="url(#nebulaB)">
      <animate attributeName="ry" values="210;238;210" dur="13s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="880" cy="500" rx="220" ry="170" fill="url(#nebulaC)">
      <animate attributeName="rx" values="220;248;220" dur="15s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="300" cy="420" rx="260" ry="190" fill="url(#nebulaA)" opacity="0.5"/>
  </g>

  <!-- Orbital rings -->
  <g fill="none" stroke="#38bdf8" opacity="0.20">
    <circle cx="1080" cy="270" r="250" stroke-width="1" stroke-dasharray="6 10">
      <animateTransform attributeName="transform" type="rotate" from="0 1080 270" to="360 1080 270" dur="70s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="270" r="330" stroke-width="0.8" stroke-dasharray="2 14" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="360 1080 270" to="0 1080 270" dur="95s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Raspberry Pi Board -->
  <g transform="translate(720, 90)" filter="url(#boardShadow)">
    <rect x="0" y="0" width="280" height="190" rx="10" fill="url(#board)" stroke="#4ade80" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="190" rx="10" fill="url(#boardSheen)"/>
    <g fill="url(#pinGold)">
      <rect x="10" y="8" width="6" height="10" rx="1"/>
      <rect x="22" y="8" width="6" height="10" rx="1"/>
      <rect x="34" y="8" width="6" height="10" rx="1"/>
      <rect x="46" y="8" width="6" height="10" rx="1"/>
      <rect x="58" y="8" width="6" height="10" rx="1"/>
      <rect x="70" y="8" width="6" height="10" rx="1"/>
      <rect x="82" y="8" width="6" height="10" rx="1"/>
      <rect x="94" y="8" width="6" height="10" rx="1"/>
      <rect x="106" y="8" width="6" height="10" rx="1"/>
      <rect x="118" y="8" width="6" height="10" rx="1"/>
      <rect x="130" y="8" width="6" height="10" rx="1"/>
      <rect x="142" y="8" width="6" height="10" rx="1"/>
      <rect x="154" y="8" width="6" height="10" rx="1"/>
      <rect x="166" y="8" width="6" height="10" rx="1"/>
      <rect x="178" y="8" width="6" height="10" rx="1"/>
      <rect x="190" y="8" width="6" height="10" rx="1"/>
      <rect x="202" y="8" width="6" height="10" rx="1"/>
      <rect x="214" y="8" width="6" height="10" rx="1"/>
      <rect x="226" y="8" width="6" height="10" rx="1"/>
      <rect x="238" y="8" width="6" height="10" rx="1"/>
    </g>
    <g fill="url(#pinGold)">
      <rect x="10" y="20" width="6" height="10" rx="1"/>
      <rect x="22" y="20" width="6" height="10" rx="1"/>
      <rect x="34" y="20" width="6" height="10" rx="1"/>
      <rect x="46" y="20" width="6" height="10" rx="1"/>
      <rect x="58" y="20" width="6" height="10" rx="1"/>
      <rect x="70" y="20" width="6" height="10" rx="1"/>
      <rect x="82" y="20" width="6" height="10" rx="1"/>
      <rect x="94" y="20" width="6" height="10" rx="1"/>
      <rect x="106" y="20" width="6" height="10" rx="1"/>
      <rect x="118" y="20" width="6" height="10" rx="1"/>
      <rect x="130" y="20" width="6" height="10" rx="1"/>
      <rect x="142" y="20" width="6" height="10" rx="1"/>
      <rect x="154" y="20" width="6" height="10" rx="1"/>
      <rect x="166" y="20" width="6" height="10" rx="1"/>
      <rect x="178" y="20" width="6" height="10" rx="1"/>
      <rect x="190" y="20" width="6" height="10" rx="1"/>
      <rect x="202" y="20" width="6" height="10" rx="1"/>
      <rect x="214" y="20" width="6" height="10" rx="1"/>
      <rect x="226" y="20" width="6" height="10" rx="1"/>
      <rect x="238" y="20" width="6" height="10" rx="1"/>
    </g>
    <rect x="100" y="60" width="80" height="80" rx="4" fill="#0c0a09" stroke="#a1a1aa" stroke-width="1"/>
    <rect x="108" y="68" width="64" height="64" rx="2" fill="#292524"/>
    <rect x="108" y="68" width="64" height="30" rx="2" fill="#ffffff" opacity="0.05"/>
    <text x="140" y="104" text-anchor="middle" fill="#d6d3d1" font-size="8" font-family="monospace">BCM2711</text>
    <text x="140" y="116" text-anchor="middle" fill="#a8a29e" font-size="6" font-family="monospace">Raspberry Pi</text>
    <circle cx="140" cy="100" r="34" fill="none" stroke="#22d3ee" stroke-width="0.8" opacity="0.55">
      <animate attributeName="r" values="20;44;20" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0;0.55" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <g stroke="url(#pinSilver)" stroke-width="1.5" fill="none">
      <line x1="108" y1="75" x2="96" y2="75"/><line x1="108" y1="83" x2="96" y2="83"/>
      <line x1="108" y1="91" x2="96" y2="91"/><line x1="108" y1="99" x2="96" y2="99"/>
      <line x1="108" y1="107" x2="96" y2="107"/><line x1="108" y1="115" x2="96" y2="115"/>
      <line x1="180" y1="75" x2="192" y2="75"/><line x1="180" y1="83" x2="192" y2="83"/>
      <line x1="180" y1="91" x2="192" y2="91"/><line x1="180" y1="99" x2="192" y2="99"/>
      <line x1="180" y1="107" x2="192" y2="107"/><line x1="180" y1="115" x2="192" y2="115"/>
    </g>
    <rect x="250" y="45" width="26" height="18" rx="2" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
    <rect x="250" y="68" width="26" height="18" rx="2" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
    <rect x="10" y="160" width="35" height="20" rx="2" fill="#1f2937" stroke="#64748b" stroke-width="1"/>
    <rect x="120" y="175" width="40" height="12" rx="2" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="260" cy="160" r="4" fill="#4ade80" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="274" cy="160" r="4" fill="#f87171" filter="url(#glow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <!-- Animated data traces -->
    <g stroke="#4ade80" stroke-width="0.6" opacity="0.4" fill="none">
      <path d="M 50 35 L 50 60 L 96 60"/>
      <path d="M 70 35 L 70 50 L 96 90"/>
      <path d="M 192 80 L 220 80 L 220 55"/>
      <path d="M 192 100 L 240 100"/>
      <path d="M 140 140 L 140 160 L 90 160"/>
    </g>
    <g fill="#a7f3d0" filter="url(#glow)">
      <circle r="1.8">
        <animateMotion path="M 50 35 L 50 60 L 96 60" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="1.8">
        <animateMotion path="M 192 100 L 240 100" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <circle r="1.8">
        <animateMotion path="M 140 140 L 140 160 L 90 160" dur="3.1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- WiFi / Signal waves (IoT) -->
  <g transform="translate(1050, 200)" fill="none" stroke="url(#wifiGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glowBig)">
    <path d="M 30 50 Q 30 30 50 20 Q 70 10 90 20 Q 110 30 110 50" opacity="0.9">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 15 65 Q 15 30 50 12 Q 85 -5 110 12 Q 140 30 140 65" opacity="0.7">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" begin="0.35s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 80 Q 0 30 50 5 Q 100 -20 145 5 Q 190 30 190 80" opacity="0.5">
      <animate attributeName="opacity" values="0.15;0.75;0.15" dur="2.4s" begin="0.7s" repeatCount="indefinite"/>
    </path>
    <circle cx="75" cy="65" r="6" fill="#7dd3fc" stroke="none"/>
  </g>

  <!-- Smart bulb -->
  <g transform="translate(1150, 380)">
    <circle cx="30" cy="25" r="78" fill="url(#bulbGlow)">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="25" r="22" fill="#fcd34d" filter="url(#glowBig)"/>
    <circle cx="23" cy="18" r="7" fill="#fffbeb" opacity="0.75"/>
    <rect x="20" y="44" width="20" height="6" rx="2" fill="#92400e"/>
    <rect x="22" y="50" width="16" height="4" rx="2" fill="#78350f"/>
    <g stroke="#fde68a" stroke-width="2" stroke-linecap="round">
      <line x1="30" y1="3" x2="30" y2="-7"/>
      <line x1="52" y1="10" x2="59" y2="3"/>
      <line x1="8" y1="10" x2="1" y2="3"/>
      <line x1="54" y1="28" x2="64" y2="28"/>
      <line x1="6" y1="28" x2="-4" y2="28"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Temperature sensor -->
  <g transform="translate(1230, 360)">
    <rect x="15" y="0" width="20" height="60" rx="10" fill="#0f2942" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="18" y="45" width="14" height="14" rx="7" fill="#ef4444" filter="url(#glow)"/>
    <rect x="22" y="10" width="6" height="35" rx="3" fill="#f87171">
      <animate attributeName="y" values="18;10;18" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="height" values="27;35;27" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <text x="25" y="-8" text-anchor="middle" fill="#bae6fd" font-size="9" font-family="monospace">24°C</text>
  </g>

  <!-- Network lines with travelling packets -->
  <g stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" opacity="0.55" fill="none">
    <line x1="1000" y1="300" x2="1080" y2="240"/>
    <line x1="1000" y1="300" x2="1175" y2="405"/>
    <line x1="1000" y1="300" x2="1255" y2="390"/>
  </g>
  <circle cx="1000" cy="300" r="5" fill="#7dd3fc" filter="url(#glow)"/>
  <circle cx="1000" cy="300" r="12" fill="none" stroke="#38bdf8" stroke-width="1">
    <animate attributeName="r" values="6;26;6" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <g fill="#e0f2fe" filter="url(#glow)">
    <circle r="2.6"><animateMotion path="M 1000 300 L 1080 240" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle r="2.6"><animateMotion path="M 1000 300 L 1175 405" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle r="2.6"><animateMotion path="M 1000 300 L 1255 390" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Code snippet -->
  <g font-family="monospace" font-size="11">
    <rect x="602" y="356" width="228" height="88" rx="8" fill="#020617" opacity="0.42"/>
    <rect x="602" y="356" width="3" height="88" rx="1.5" fill="#38bdf8" opacity="0.6"/>
    <g opacity="0.55" fill="#86efac">
      <text x="620" y="380">import RPi.GPIO as GPIO</text>
      <text x="620" y="396">GPIO.setmode(GPIO.BCM)</text>
      <text x="620" y="412">GPIO.setup(18, GPIO.OUT)</text>
      <text x="620" y="428">GPIO.output(18, GPIO.HIGH)</text>
    </g>
    <rect x="620" y="420" width="6" height="11" fill="#7dd3fc" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Twinkling particles -->
  <g fill="#7dd3fc" filter="url(#glow)">
    <circle cx="200" cy="100" r="2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="200" r="1.5"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="80" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="320" r="1.5"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1350" cy="150" r="2"><animate attributeName="opacity" values="0.25;0.95;0.25" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1300" cy="450" r="2.5"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="1400" cy="300" r="1.5"><animate attributeName="opacity" values="0.3;0.85;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="450" r="2"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="500" r="1.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="520" r="2"><animate attributeName="opacity" values="0.75;0.2;0.75" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="290" r="1.2"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1180" cy="90" r="1.8"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Drifting motes -->
  <g fill="#bae6fd" opacity="0.5">
    <circle cx="0" cy="0" r="1.6">
      <animateMotion path="M 160 560 Q 420 380 700 540" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="1.2">
      <animateMotion path="M 1420 60 Q 1150 220 900 60" dur="30s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect width="1440" height="600" fill="url(#scan)"/>
  <rect width="1440" height="600" fill="url(#vignette1)"/>
</svg>
