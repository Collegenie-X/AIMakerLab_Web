<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" width="1440" height="600">
  <defs>
    <linearGradient id="fbg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#031225"/>
      <stop offset="45%" style="stop-color:#062a44"/>
      <stop offset="100%" style="stop-color:#031a38"/>
    </linearGradient>
    <radialGradient id="fnebA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#031225" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fnebB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#031225" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fbrowserbar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2941"/>
      <stop offset="100%" stop-color="#0b1f33"/>
    </linearGradient>
    <filter id="fglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fsoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="fshadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#00070f" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1440" height="600" fill="url(#fbg1)"/>
  <g filter="url(#fsoft)">
    <ellipse cx="1100" cy="220" rx="320" ry="240" fill="url(#fnebA)"/>
    <ellipse cx="1300" cy="420" rx="240" ry="200" fill="url(#fnebB)"/>
  </g>

  <!-- Browser window mockup -->
  <g transform="translate(760, 90)" filter="url(#fshadow)">
    <rect x="0" y="0" width="420" height="280" rx="10" fill="#e2e8f0"/>
    <rect x="0" y="0" width="420" height="30" rx="10" fill="url(#fbrowserbar)"/>
    <circle cx="18" cy="15" r="5" fill="#ff5f57"/>
    <circle cx="34" cy="15" r="5" fill="#ffbd2e"/>
    <circle cx="50" cy="15" r="5" fill="#28c840"/>
    <rect x="70" y="8" width="270" height="14" rx="7" fill="#1e3a52"/>
    <text x="90" y="18" fill="#7dd3fc" font-size="8" font-family="monospace">myapp.vercel.app</text>

    <rect x="0" y="30" width="420" height="250" fill="#f8fafc"/>
    <rect x="20" y="50" width="140" height="16" rx="4" fill="#0f172a"/>
    <rect x="20" y="78" width="220" height="10" rx="3" fill="#94a3b8"/>
    <rect x="20" y="96" width="180" height="10" rx="3" fill="#cbd5e1"/>
    <rect x="20" y="122" width="110" height="34" rx="8" fill="url(#fnebB)" opacity="1" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="20" y="122" width="110" height="34" rx="8" fill="#6366f1"/>
    <text x="75" y="144" text-anchor="middle" fill="white" font-size="11" font-family="sans-serif" font-weight="600">시작하기</text>

    <g transform="translate(230,50)">
      <rect width="170" height="90" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="26" cy="26" r="12" fill="#22d3ee" opacity="0.85"/>
      <rect x="46" y="18" width="100" height="8" rx="3" fill="#334155"/>
      <rect x="46" y="32" width="80" height="7" rx="3" fill="#cbd5e1"/>
      <rect x="16" y="52" width="138" height="7" rx="3" fill="#e2e8f0"/>
      <rect x="16" y="66" width="100" height="7" rx="3" fill="#e2e8f0"/>
    </g>

    <g transform="translate(20,180)">
      <rect width="380" height="70" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="16" y="16" width="60" height="38" rx="6" fill="#f1f5f9"/>
      <rect x="88" y="18" width="150" height="9" rx="3" fill="#334155"/>
      <rect x="88" y="34" width="200" height="7" rx="3" fill="#cbd5e1"/>
      <rect x="88" y="48" width="120" height="7" rx="3" fill="#e2e8f0"/>
    </g>
  </g>

  <!-- Component tree floating -->
  <g font-family="monospace" font-size="11" fill="#7dd3fc">
    <g transform="translate(120,110)"><rect width="150" height="30" rx="6" fill="#0e293f" stroke="#22d3ee" stroke-width="1"/><text x="12" y="20">&lt;Navbar /&gt;</text></g>
    <g transform="translate(160,160)"><rect width="150" height="30" rx="6" fill="#0e293f" stroke="#6366f1" stroke-width="1"/><text x="12" y="20" fill="#c7d2fe">&lt;Hero /&gt;</text></g>
    <g transform="translate(120,210)"><rect width="170" height="30" rx="6" fill="#0e293f" stroke="#22d3ee" stroke-width="1"/><text x="12" y="20">&lt;FeatureCard /&gt;</text></g>
    <g transform="translate(170,260)"><rect width="150" height="30" rx="6" fill="#0e293f" stroke="#6366f1" stroke-width="1"/><text x="12" y="20" fill="#c7d2fe">&lt;Footer /&gt;</text></g>
  </g>

  <g fill="#67e8f9" filter="url(#fglow)">
    <circle cx="200" cy="380" r="2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1380" cy="140" r="2"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1300" cy="500" r="2.4"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/></circle>
  </g>
</svg>
